# GitHub Actions smoke test: allow extra boot time for first-time page ingest.
services:
  api:
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/ready')",
        ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
